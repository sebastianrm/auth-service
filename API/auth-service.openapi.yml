openapi: 3.2.1
info:
  title: auth-service API
  version: 1.0.0
  description: >
    Especificación OpenAPI del microservicio auth-service de Yanki.
    Documenta autenticación JWT y gestión de credenciales, incluyendo
    casos de éxito y error con sus códigos HTTP correspondientes.

servers:
  - url: http://localhost:8081
    description: Desarrollo local

tags:
  - name: Auth
    description: Operaciones de autenticación JWT
  - name: Credentials
    description: Operaciones CRUD de credenciales

paths:
  /api/auth/login:
    post:
      tags: [Auth]
      summary: Login de usuario
      description: Autentica al usuario y emite access token y refresh token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            examples:
              loginOk:
                summary: Login válido
                value:
                  username: cliente@yanki.com
                  password: TempPass123
      responses:
        '200':
          description: Login exitoso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
              examples:
                success:
                  value:
                    accessToken: jwt-access-token
                    refreshToken: jwt-refresh-token
                    tokenType: Bearer
                    expiresIn: 900
        '400':
          description: Request inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              examples:
                validationError:
                  value:
                    timestamp: '2026-11-08T08:00:00'
                    status: 400
                    error: Bad Request
                    code: VALIDATION_ERROR
                    message: Request body inválido
                    path: /api/auth/login
                    details: [username: must not be blank]
        '401':
          description: Credenciales inválidas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              examples:
                invalidCredentials:
                  value:
                    timestamp: '2026-11-08T08:00:00'
                    status: 401
                    error: Unauthorized
                    code: INVALID_CREDENTIALS
                    message: Username/password incorrectos
                    path: /api/auth/login
                    details: []
        '403':
          description: Cuenta bloqueada o deshabilitada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              examples:
                accountLocked:
                  value:
                    timestamp: '2026-11-08T08:00:00'
                    status: 403
                    error: Forbidden
                    code: ACCOUNT_LOCKED
                    message: Cuenta bloqueada temporalmente
                    path: /api/auth/login
                    details: []
                accountDisabled:
                  value:
                    timestamp: '2026-11-08T08:00:00'
                    status: 403
                    error: Forbidden
                    code: ACCOUNT_DISABLED
                    message: Credencial deshabilitada
                    path: /api/auth/login
                    details: []
        '500':
          description: Error interno no controlado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /api/auth/refresh:
    post:
      tags: [Auth]
      summary: Refrescar access token
      description: Emite un nuevo access token usando un refresh token válido.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '200':
          description: Refresh exitoso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          description: Request inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Refresh token inválido, expirado o revocado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              examples:
                revoked:
                  value:
                    timestamp: '2026-11-08T08:00:00'
                    status: 401
                    error: Unauthorized
                    code: REFRESH_TOKEN_REVOKED
                    message: Refresh token revocado
                    path: /api/auth/refresh
                    details: []
                invalid:
                  value:
                    timestamp: '2026-11-08T08:00:00'
                    status: 401
                    error: Unauthorized
                    code: TOKEN_INVALID
                    message: Token inválido
                    path: /api/auth/refresh
                    details: []
        '500':
          description: Error interno no controlado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /api/auth/validate:
    get:
      tags: [Auth]
      summary: Validar access token
      description: >
        Valida el token Bearer recibido en el header Authorization y devuelve sus claims.
      parameters:
        - name: Authorization
          in: header
          required: true
          description: Token Bearer a validar
          schema:
            type: string
            example: Bearer eyJhbGciOiJIUzI1NiJ9...
      responses:
        '200':
          description: Token válido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenValidationResponse'
              examples:
                valid:
                  value:
                    valid: true
                    username: cliente@yanki.com
                    customerId: CUST-001
                    roles:
                      - ROLE_CUSTOMER
        '400':
          description: Header Authorization ausente o mal formado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              examples:
                invalidHeader:
                  value:
                    timestamp: '2026-11-08T08:00:00'
                    status: 400
                    error: Bad Request
                    code: INVALID_TOKEN
                    message: El encabezado Authorization debe tener el formato Bearer <token>
                    path: /api/auth/validate
                    details: []
        '401':
          description: Token inválido o expirado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              examples:
                expired:
                  value:
                    timestamp: '2026-11-08T08:00:00'
                    status: 401
                    error: Unauthorized
                    code: TOKEN_EXPIRED
                    message: Access token expirado
                    path: /api/auth/validate
                    details: []
        '500':
          description: Error interno no controlado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /api/auth/credentials:
    post:
      tags: [Credentials]
      summary: Crear credencial
      description: Crea una nueva credencial de acceso.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CredentialCreateRequest'
      responses:
        '201':
          description: Credencial creada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CredentialResponse'
        '400':
          description: Request inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: Credencial duplicada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              examples:
                duplicated:
                  value:
                    timestamp: '2026-11-08T08:00:00'
                    status: 409
                    error: Conflict
                    code: CREDENTIAL_ALREADY_EXISTS
                    message: Username duplicado
                    path: /api/auth/credentials
                    details: []
        '500':
          description: Error interno no controlado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

    get:
      tags: [Credentials]
      summary: Listar credenciales
      description: Retorna todas las credenciales registradas.
      responses:
        '200':
          description: Listado exitoso
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CredentialResponse'
        '500':
          description: Error interno no controlado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /api/auth/credentials/{id}:
    get:
      tags: [Credentials]
      summary: Obtener credencial por id
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Credencial encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CredentialResponse'
        '404':
          description: Credencial no encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              examples:
                notFound:
                  value:
                    timestamp: '2026-11-08T08:00:00'
                    status: 404
                    error: Not Found
                    code: CREDENTIAL_NOT_FOUND
                    message: Credencial no encontrada
                    path: /api/auth/credentials/123
                    details: []
        '500':
          description: Error interno no controlado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

    put:
      tags: [Credentials]
      summary: Actualizar credencial por id
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CredentialUpdateRequest'
      responses:
        '200':
          description: Credencial actualizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CredentialResponse'
        '400':
          description: Request inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Credencial no encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: Conflicto por duplicidad
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          description: Error interno no controlado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

    delete:
      tags: [Credentials]
      summary: Eliminar credencial por id
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Credencial eliminada
        '404':
          description: Credencial no encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          description: Error interno no controlado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

components:
  schemas:
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          format: email
        password:
          type: string

    RefreshTokenRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string

    CredentialCreateRequest:
      type: object
      required: [username, password, customerId, email, roles]
      properties:
        username:
          type: string
          format: email
        password:
          type: string
        customerId:
          type: string
        email:
          type: string
          format: email
        roles:
          type: array
          items:
            type: string

    CredentialUpdateRequest:
      type: object
      properties:
        password:
          type: string
        roles:
          type: array
          items:
            type: string
        enabled:
          type: boolean

    TokenResponse:
      type: object
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        tokenType:
          type: string
          example: Bearer
        expiresIn:
          type: integer
          format: int64

    TokenValidationResponse:
      type: object
      properties:
        valid:
          type: boolean
        username:
          type: string
        customerId:
          type: string
        roles:
          type: array
          items:
            type: string

    CredentialResponse:
      type: object
      properties:
        id:
          type: string
        username:
          type: string
        customerId:
          type: string
        email:
          type: string
        roles:
          type: array
          items:
            type: string
        enabled:
          type: boolean
        failedAttempts:
          type: integer
        lockedUntil:
          type: string
          format: date-time
        lastLoginAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ApiError:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
        status:
          type: integer
        error:
          type: string
        code:
          type: string
        message:
          type: string
        path:
          type: string
        details:
          type: array
          items:
            type: string
